<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up | G.T.G Enterprises</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900 min-h-screen flex flex-col">

    <!-- Navigation (Simplified) -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-center h-16 items-center">
                <a href="index.html" class="flex items-center gap-2">
                    <div class="w-10 h-10 bg-gradient-to-tr from-blue-500 to-cyan-400 rounded-lg flex items-center justify-center text-white shadow-lg">
                        <i data-lucide="layers"></i>
                    </div>
                    <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600">G.T.G Enterprises</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Auth Container -->
    <div class="flex-grow flex items-center justify-center p-4 py-12">
        <div class="bg-white rounded-3xl shadow-xl border border-gray-100 w-full max-w-md overflow-hidden relative">
            
            <!-- Header -->
            <div class="p-8 pb-0 text-center">
                <h1 id="page-title" class="text-3xl font-bold text-gray-900 mb-2">Welcome Back</h1>
                <p id="page-subtitle" class="text-gray-500">Enter your details to access your account</p>
            </div>

            <!-- Toggle Switch -->
            <div class="flex justify-center mt-6 px-8">
                <div class="bg-gray-100 p-1 rounded-xl flex w-full">
                    <button onclick="toggleAuth('login')" id="tab-login" class="flex-1 py-2 rounded-lg text-sm font-bold transition bg-white text-gray-900 shadow-sm">Sign In</button>
                    <button onclick="toggleAuth('signup')" id="tab-signup" class="flex-1 py-2 rounded-lg text-sm font-bold text-gray-500 hover:text-gray-900 transition">Create Account</button>
                </div>
            </div>

            <div class="p-8">
                <!-- Login Form -->
                <form id="login-form" class="space-y-5 block">
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-700">Email Address</label>
                        <div class="relative">
                            <input type="email" name="email" required class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition" placeholder="you@example.com">
                            <i data-lucide="mail" class="absolute left-3 top-3.5 text-gray-400 w-5 h-5"></i>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between">
                            <label class="text-sm font-medium text-gray-700">Password</label>
                            <a href="#" class="text-sm text-blue-600 hover:underline">Forgot password?</a>
                        </div>
                        <div class="relative">
                            <input type="password" name="password" required class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition" placeholder="••••••••">
                            <i data-lucide="lock" class="absolute left-3 top-3.5 text-gray-400 w-5 h-5"></i>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                        Sign In
                    </button>
                </form>

                <!-- Sign Up Form -->
                <form id="signup-form" class="space-y-5 hidden">
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-700">Full Name</label>
                        <div class="relative">
                            <input type="text" name="fullname" required class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition" placeholder="John Doe">
                            <i data-lucide="user" class="absolute left-3 top-3.5 text-gray-400 w-5 h-5"></i>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-700">Email Address</label>
                        <div class="relative">
                            <input type="email" name="email" required class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition" placeholder="you@example.com">
                            <i data-lucide="mail" class="absolute left-3 top-3.5 text-gray-400 w-5 h-5"></i>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-700">Account Type</label>
                        <select name="role" class="w-full pl-3 pr-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition bg-white">
                            <option value="buyer">Buyer (I want to shop)</option>
                            <option value="seller">Seller (I want to sell)</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-700">Password</label>
                        <div class="relative">
                            <input type="password" name="password" required class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition" placeholder="Create a password">
                            <i data-lucide="lock" class="absolute left-3 top-3.5 text-gray-400 w-5 h-5"></i>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                        Create Account
                    </button>
                </form>
            </div>
            
            <div class="bg-gray-50 p-4 text-center text-sm text-gray-500 border-t border-gray-100">
                By continuing, you agree to our <a href="terms.html" class="text-blue-600 hover:underline">Terms of Service</a>.
            </div>
        </div>
    </div>

    <footer class="py-6 text-center">
        <div class="flex items-center justify-center gap-2 text-sm text-gray-400">
            <span>Developed by</span>
            <a href="https://github.com/aruosatech360-png" target="_blank" class="flex items-center gap-1 font-semibold text-gray-600 hover:text-blue-600 transition">
                <img src="Aruosa Tech Icon.png" alt="Aruosa Tech" class="w-5 h-5">
                Aruosa Tech
            </a>
        </div>
    </footer>

    <script>
        lucide.createIcons();

        function toggleAuth(type) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            const title = document.getElementById('page-title');
            const subtitle = document.getElementById('page-subtitle');

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabLogin.classList.add('bg-white', 'text-gray-900', 'shadow-sm');
                tabLogin.classList.remove('text-gray-500');
                tabSignup.classList.remove('bg-white', 'text-gray-900', 'shadow-sm');
                tabSignup.classList.add('text-gray-500');
                title.innerText = "Welcome Back";
                subtitle.innerText = "Enter your details to access your account";
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                tabSignup.classList.add('bg-white', 'text-gray-900', 'shadow-sm');
                tabSignup.classList.remove('text-gray-500');
                tabLogin.classList.remove('bg-white', 'text-gray-900', 'shadow-sm');
                tabLogin.classList.add('text-gray-500');
                title.innerText = "Join G.T.G";
                subtitle.innerText = "Create an account to start shopping or selling";
            }
        }

        // --- DEMO LOGIC: Redirect to Profile on Submit ---
        // This allows you to show the flow (Login -> Profile) without a backend.
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'profile.html';
        });

        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'profile.html';
        });
    </script>
</body>
</html>
